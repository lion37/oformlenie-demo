<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>UI-kit — демо</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#151A23}a:hover{color:#000}
*{box-sizing:border-box}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<style>.demo-badge{position:fixed;left:12px;bottom:12px;z-index:9999;font:600 12px Manrope,system-ui,sans-serif;background:#121A24;color:#C5F66A;padding:6px 10px;border-radius:999px;opacity:.85;pointer-events:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width: 1440px; height: 1820px; padding: 64px; background: #F7F8FA; font-family: Manrope, system-ui, sans-serif; color: #151A23; display: flex; flex-direction: column; gap: 40px">

<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #596273">UI-kit · P0</span><h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.02em">Токены, компоненты и состояния</h1></div>
<span style="font-size: 14px; color: #596273">Manrope · сетка 12/8/4 · шаг 4 px · радиусы 12 / 20–24</span>
</div>

<section style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #F7F8FA; border: 1px solid #DCE1E8"></span><span style="font-size: 13px; font-weight: 700">Фон</span><span style="font-size: 12px; color: #596273">#F7F8FA</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE1E8"></span><span style="font-size: 13px; font-weight: 700">Поверхность</span><span style="font-size: 12px; color: #596273">#FFFFFF</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #151A23"></span><span style="font-size: 13px; font-weight: 700">Текст</span><span style="font-size: 12px; color: #596273">#151A23</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #596273"></span><span style="font-size: 13px; font-weight: 700">Вторичный</span><span style="font-size: 12px; color: #596273">#596273</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #121A24"></span><span style="font-size: 13px; font-weight: 700">Тёмная</span><span style="font-size: 12px; color: #596273">#121A24</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #C5F66A"></span><span style="font-size: 13px; font-weight: 700">Акцент</span><span style="font-size: 12px; color: #596273">#C5F66A · только с тёмным</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #A9C9FF"></span><span style="font-size: 13px; font-weight: 700">Доп. акцент</span><span style="font-size: 12px; color: #596273">#A9C9FF</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #DCE1E8"></span><span style="font-size: 13px; font-weight: 700">Граница</span><span style="font-size: 12px; color: #596273">#DCE1E8</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 72px; border-radius: 16px; background: #B42318"></span><span style="font-size: 13px; font-weight: 700">Ошибка</span><span style="font-size: 12px; color: #596273">#B42318</span></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Основная кнопка</h2>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; align-items: end">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; color: #596273">default</span><button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #C5F66A; color: #121A24; font: 700 15px Manrope, sans-serif">Загрузить работу</button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; color: #596273">hover · стрелка +3 px</span><button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #B4EA52; color: #121A24; font: 700 15px Manrope, sans-serif">Оформить работу  →</button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; color: #596273">focus</span><button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #C5F66A; color: #121A24; font: 700 15px Manrope, sans-serif; outline: 3px solid #A9C9FF; outline-offset: 2px">Загрузить работу</button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; color: #596273">active · scale 0.98</span><button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #A9DB4C; color: #121A24; font: 700 15px Manrope, sans-serif; transform: scale(.98)">Загрузить работу</button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; color: #596273">disabled</span><button type="button" disabled="" style="height: 52px; border: 0; border-radius: 12px; background: #E6EAEF; color: #6B7482; font: 700 15px Manrope, sans-serif">Оплатить</button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; color: #596273">loading</span><button type="button" aria-busy="true" style="height: 52px; border: 0; border-radius: 12px; background: #C5F66A; color: #121A24; font: 700 15px Manrope, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 10px"><svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9"></path></svg>Загружаем</button></div>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Поле ввода</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="k1" style="font-size: 14px; font-weight: 600">default</label><input id="k1" placeholder="name@example.com" style="height: 48px; padding: 0 14px; border: 1px solid #DCE1E8; border-radius: 12px; font: 500 16px Manrope, sans-serif"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="k2" style="font-size: 14px; font-weight: 600">focus</label><input id="k2" value="name@exa" style="height: 48px; padding: 0 14px; border: 1px solid #151A23; box-shadow: 0 0 0 3px #A9C9FF; border-radius: 12px; font: 500 16px Manrope, sans-serif; outline: none"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="k3" style="font-size: 14px; font-weight: 600">error</label><input id="k3" value="name@" aria-invalid="true" aria-describedby="k3e" style="height: 48px; padding: 0 14px; border: 1px solid #B42318; border-radius: 12px; font: 500 16px Manrope, sans-serif"><span id="k3e" style="display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: #B42318"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>Введите email полностью</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="k4" style="font-size: 14px; font-weight: 600; color: #596273">disabled</label><input id="k4" disabled="" value="30" style="height: 48px; padding: 0 14px; border: 1px solid #E6EAEF; border-radius: 12px; font: 500 16px Manrope, sans-serif; background: #F3F5F8; color: #6B7482"></div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Статусы и уведомления</h2>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: #F0FADF; color: #2E5A12; font-size: 13px; font-weight: 700"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Исправлено</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: #FFF1DB; color: #8A5300; font-size: 13px; font-weight: 700"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path></svg>Требует проверки</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: #EEF0F3; color: #3D4553; font-size: 13px; font-weight: 700"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M6 6l12 12"></path></svg>Не поддерживается</span>
</div>
<div role="status" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: #121A24; color: #FFFFFF; font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9C9FF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M18 3v4h-4M6 21v-4h4"></path></svg><span><b>Восстанавливаем соединение</b><br>Обработка продолжается на сервере.</span></div>
<div role="alert" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: #FDECEA; color: #7A1A12; font-size: 14px; line-height: 1.45; border: 1px solid #F3C1BB"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg><span style="flex: 1"><b>Это DOC, а нужен DOCX.</b> Откройте файл в Word и выберите «Сохранить как → DOCX».</span><button type="button" aria-label="Закрыть уведомление" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #7A1A12; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
</section>
</div>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Загрузчик файла</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<div style="height: 180px; border: 2px dashed #B8C1CD; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path></svg><span style="font-size: 14px; font-weight: 700">Перетащите DOCX или</span><span style="font-size: 14px; font-weight: 700; text-decoration: underline">выберите файл</span><span style="font-size: 12px; color: #596273">empty · до 20 МБ</span></div>
<div style="height: 180px; border: 2px solid #151A23; background: #F4FDE4; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; box-shadow: 0 0 0 4px #C5F66A"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"></path></svg><span style="font-size: 14px; font-weight: 700">Отпустите файл</span><span style="font-size: 12px; color: #596273">drag-over</span></div>
<div style="height: 180px; border: 1px solid #DCE1E8; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 20px"><span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">diplom_glava2.docx</span><span style="font-size: 13px; color: #596273">1,6 из 2,5 МБ · 64%</span><div role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="Загрузка файла" style="height: 8px; border-radius: 8px; background: #EEF0F3; overflow: hidden"><div style="width: 64%; height: 100%; background: #151A23"></div></div><button type="button" style="align-self: flex-start; height: 36px; padding: 0 12px; border: 1px solid #DCE1E8; border-radius: 10px; background: #FFFFFF; font: 600 13px Manrope, sans-serif">Отменить</button></div>
<div style="height: 180px; border: 1px solid #F3C1BB; background: #FFF8F7; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 20px"><span style="display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; color: #B42318"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>Файл защищён паролем</span><span style="font-size: 13px; line-height: 1.45; color: #151A23">Снимите защиту в Word и загрузите снова. Настройки сохранены.</span><span style="font-size: 12px; color: #596273">error</span></div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Иконки</h2><span style="font-size: 13px; color: #596273">сетка 24 px · линия 1,8 · скруглённые концы · акцент только в плашке</span></div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 16px; background: #F7F8FA"><span style="width: 48px; height: 48px; border-radius: 14px; background: #C5F66A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#121A24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></span><span style="font-size: 12px; font-weight: 700">Загрузка</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 16px; background: #F7F8FA"><span style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE1E8; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></span><span style="font-size: 12px; font-weight: 700">Скачать</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 16px; background: #F7F8FA"><span style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE1E8; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg></span><span style="font-size: 12px; font-weight: 700">Документ</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 16px; background: #F7F8FA"><span style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE1E8; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 14.5l2 2 4-4.5"></path></svg></span><span style="font-size: 12px; font-weight: 700">Готово</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 16px; background: #F7F8FA"><span style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE1E8; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span><span style="font-size: 12px; font-weight: 700">Настройки</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 16px; background: #F7F8FA"><span style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE1E8; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><rect x="8" y="7" width="8" height="10" rx=".5" stroke-dasharray="2 2"></rect></svg></span><span style="font-size: 12px; font-weight: 700">Поля</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 16px; background: #F7F8FA"><span style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE1E8; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M5 4v16M3 6l2-2 2 2M3 18l2 2 2-2"></path></svg></span><span style="font-size: 12px; font-weight: 700">Интервал</span></div>
