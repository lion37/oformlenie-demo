    let iy = 20 + g.t * ky, ih = 140 - (g.t + g.b) * ky;
    const tooBig = iw < 20 || ih < 30;
    if (tooBig) { ix = 34 + last.l * kx; iw = 100 - (last.l + last.r) * kx; iy = 20 + last.t * ky; ih = 140 - (last.t + last.b) * ky; }
    const r1 = (n) => Math.round(n * 10) / 10;
    let lp = '';
    const x1 = ix + 5, x2 = ix + iw - 5;
    let y = iy + 9, k = 0;
    while (y <= iy + ih - 7 && k < 16) {
      const endOfPara = (k % 5) === 4;
      const xe = endOfPara ? x1 + (x2 - x1) * 0.6 : x2;
      lp += 'M' + r1((k % 5) === 0 ? x1 + 5 : x1) + ' ' + r1(y) + 'H' + r1(Math.max(xe, x1 + 4));
      y += endOfPara ? 12 : 7.5; k++;
    }
    const f = s.focus;
    const hi = (side) => f === side;
    const anyInv = N.l === null || N.r === null || N.t === null || N.b === null;
    const errCss = 'border-color: var(--bd-B42318); background: var(--bg-FFF8F7)';
    const margins = {
      ml: s.ml, mr: s.mr, mt: s.mt, mb: s.mb,
      ix: r1(ix), iy: r1(iy), iw: r1(iw), ih: r1(ih),
      innerStyle: 'transition: x .25s cubic-bezier(.22,1,.36,1), y .25s cubic-bezier(.22,1,.36,1), width .25s cubic-bezier(.22,1,.36,1), height .25s cubic-bezier(.22,1,.36,1)',
      linesPath: lp,
      dimL: 'M34 89H' + r1(ix) + 'M' + r1(ix) + ' 86V92M34 86V92', dimR: 'M' + r1(ix + iw) + ' 120H134M' + r1(ix + iw) + ' 117V123M134 117V123', dimT: 'M84 20V' + r1(iy) + 'M81 ' + r1(iy) + 'H87M81 20H87', dimB: 'M84 ' + r1(iy + ih) + 'V160M81 ' + r1(iy + ih) + 'H87M81 160H87',
      cL: hi('l') ? '#4A7BD0' : '#7FA4E0', wL: hi('l') ? 2.2 : 1.2,
      cR: hi('r') ? '#4A7BD0' : '#7FA4E0', wR: hi('r') ? 2.2 : 1.2,
      cT: hi('t') ? '#4A7BD0' : '#7FA4E0', wT: hi('t') ? 2.2 : 1.2,
      cB: hi('b') ? '#4A7BD0' : '#7FA4E0', wB: hi('b') ? 2.2 : 1.2,
      pL: hi('l') ? '#C5F66A' : '#FFFFFF', tL: hi('l') ? '#121A24' : '#2B4C86',
      pR: hi('r') ? '#C5F66A' : '#FFFFFF', tR: hi('r') ? '#121A24' : '#2B4C86',
      pT: hi('t') ? '#C5F66A' : '#FFFFFF', tT: hi('t') ? '#121A24' : '#2B4C86',
      pB: hi('b') ? '#C5F66A' : '#FFFFFF', tB: hi('b') ? '#121A24' : '#2B4C86',
      diagLabel: 'Схема полей страницы A4: левое ' + s.ml + ', правое ' + s.mr + ', верхнее ' + s.mt + ', нижнее ' + s.mb + ' мм',
      mlInv: N.l === null ? 'true' : 'false', mrInv: N.r === null ? 'true' : 'false', mtInv: N.t === null ? 'true' : 'false', mbInv: N.b === null ? 'true' : 'false',
      mlErr: N.l === null ? errCss : '', mrErr: N.r === null ? errCss : '', mtErr: N.t === null ? errCss : '', mbErr: N.b === null ? errCss : '',
      marginErr: anyInv || tooBig,
      marginMsg: anyInv ? 'Введите значение от 0 до 60 мм' : 'Поля слишком большие: на странице не остаётся места для текста',
      blur: () => this.setState({ focus: null }),
      focMl: () => this.setState({ focus: 'l' }), focMr: () => this.setState({ focus: 'r' }),
      focMt: () => this.setState({ focus: 't' }), focMb: () => this.setState({ focus: 'b' })
    };
    const upd = (side, key) => (e) => {
      const v = e.target.value;
      const n = num(v);
      const lg = { ...this.state.lastGood };
      if (n !== null) {
        const t = { ...lg, [side]: n };
        if (100 - (t.l + t.r) * kx >= 20 && 140 - (t.t + t.b) * ky >= 30) lg[side] = n;
      }
      this.setState({ [key]: v, lastGood: lg });
    };
    margins.setMl = upd('l', 'ml'); margins.setMr = upd('r', 'mr'); margins.setMt = upd('t', 'mt'); margins.setMb = upd('b', 'mb');
    const ext = {
      font: s.font,
      fontFamily: cur.family,
      fontOpen: s.fontOpen,
      fontOpenStr: s.fontOpen ? 'true' : 'false',
      fontBtnStyle: s.fontOpen ? 'border-color: var(--bd-151A23); box-shadow: 0 0 0 3px #A9C9FF' : '',
      chevStyle: s.fontOpen ? 'transform: rotate(180deg)' : 'transform: none',
      toggleFont: () => this.setState({ fontOpen: !s.fontOpen }),
      fonts: FONTS.map((f) => ({
        ...f,
        selected: f.name === s.font,
        selStr: f.name === s.font ? 'true' : 'false',
        bg: f.name === s.font ? 'background: var(--bg-F4FDE4)' : 'background: transparent',
        pick: () => this.setState({ font: f.name, fontOpen: false })
      })),
      interval: s.interval,
      intervals: IV.map((v) => ({
        ...v,
        selStr: v.label === s.interval ? 'true' : 'false',
        style: v.label === s.interval ? 'background: var(--bg-FFFFFF); color: var(--fg-151A23); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04)' : 'background: transparent; color: var(--fg-596273)',
        pick: () => this.setState({ interval: v.label })
      }))
    };
    const on = 'background: var(--bg-FFFFFF); color: var(--fg-151A23); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04)';
    const off = 'background: transparent; color: var(--fg-596273)';
    return {
      ...ext,
      ...margins,
      isTpl: m === 'tpl',
      isOwn: m === 'own',
      tplSel: m === 'tpl' ? 'true' : 'false',
      ownSel: m === 'own' ? 'true' : 'false',
      tplStyle: m === 'tpl' ? on : off,
      ownStyle: m === 'own' ? on : off,
      pickTpl: () => this.setState({ mode: 'tpl' }),
      pickOwn: () => this.setState({ mode: 'own' })
    };
  }
}

function __toggleTheme() {
  var r = document.documentElement, cur = r.getAttribute('data-theme');
  if (!cur) cur = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
}
(function () { try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
(function () {
  var rv = Component.prototype.renderVals;
  Component.prototype.renderVals = function () { var v = (rv ? rv.call(this) : null) || {}; v.toggleTheme = __toggleTheme; return v; };
})();

window.dcMount(Component, document.getElementById('tpl'), document.getElementById('app'));
</script>
