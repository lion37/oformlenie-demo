<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Оформление работ по требованиям — демо</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8FA}
a{color:#151A23}a:hover{color:#000}
*{box-sizing:border-box}
:focus-visible{outline:3px solid #A9C9FF;outline-offset:2px}
.btn{transition:background-color .15s cubic-bezier(.22,1,.36,1),transform .15s cubic-bezier(.22,1,.36,1),border-color .15s}
.btn:active{transform:scale(.98)}
.btn .arr{transition:transform .15s cubic-bezier(.22,1,.36,1)}
.btn:hover .arr{transform:translateX(3px)}
.btn-accent:hover{background:#B4EA52 !important}
.btn-ghost-d:hover{background:rgba(255,255,255,.08) !important;border-color:rgba(255,255,255,.4) !important}
.nav a{transition:color .15s}.nav a:hover{color:#151A23 !important}
.card{transition:transform .2s cubic-bezier(.22,1,.36,1),border-color .2s,box-shadow .2s}
@media (hover:hover) and (pointer:fine){.card:hover{transform:translateY(-4px);border-color:#C9D3E0 !important;box-shadow:0 18px 40px -18px rgba(21,26,35,.22)}}
.fadeup{animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fixX{0%,18%{transform:translateX(var(--dx))}42%,88%{transform:translateX(0)}100%{transform:translateX(var(--dx))}}
@keyframes fixH{0%,18%{transform:translateX(-36px) scale(1.14)}42%,88%{transform:none}100%{transform:translateX(-36px) scale(1.14)}}
@keyframes gap{0%,18%{transform:translateY(var(--dy))}42%,88%{transform:none}100%{transform:translateY(var(--dy))}}
@keyframes chk{0%,46%{opacity:0;transform:translateY(8px)}54%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes guide{0%,24%{opacity:0}38%,90%{opacity:1}100%{opacity:0}}
@keyframes glow{0%,30%{opacity:0}42%,60%{opacity:1}75%,100%{opacity:0}}
@keyframes blobA{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,40px)}}
@keyframes blobB{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-50px)}}
.l{animation:fixX 7s cubic-bezier(.22,1,.36,1) infinite}
.h{animation:fixH 7s cubic-bezier(.22,1,.36,1) infinite;transform-origin:left center}
.g{animation:gap 7s cubic-bezier(.22,1,.36,1) infinite}
.c1{animation:chk 7s cubic-bezier(.22,1,.36,1) infinite}
.c2{animation:chk 7s cubic-bezier(.22,1,.36,1) infinite .25s}
.c3{animation:chk 7s cubic-bezier(.22,1,.36,1) infinite .5s}
.gd{animation:guide 7s ease infinite}
.gl{animation:glow 7s ease infinite}
.blob{display:none}
@media (min-width:1024px){.blob{display:block}.ba-tabs{display:none !important}}
.blob-a{animation:blobA 20s ease-in-out infinite}
.blob-b{animation:blobB 24s ease-in-out infinite}
.paused .l,.paused .h,.paused .g,.paused .c1,.paused .c2,.paused .c3,.paused .gd,.paused .gl,.paused .blob-a,.paused .blob-b{animation-play-state:paused}
.reduced .l,.reduced .h,.reduced .g,.reduced .gl,.reduced .blob-a,.reduced .blob-b,.reduced .fadeup{animation:none}
.reduced .c1,.reduced .c2,.reduced .c3,.reduced .gd{animation:none;opacity:1}
@media (prefers-reduced-motion:reduce){.l,.h,.g,.gl,.blob-a,.blob-b,.fadeup{animation:none !important}.c1,.c2,.c3,.gd{animation:none !important;opacity:1}}
@media (max-width:767px){.hide-m{display:none !important}.nav{display:none !important}.full-m{width:100%;justify-content:center}.callouts{position:static !important;margin-top:16px}}
@media (min-width:768px){.menu-btn{display:none !important}}
@media (min-width:1024px){.sticky-d{position:sticky;top:104px;align-self:flex-start}}
.steps .card{position:relative}
.tear{animation:tear .7s cubic-bezier(.45,0,.7,.2) forwards}
@keyframes tear{0%{transform:none}28%{transform:translateY(5px) rotate(1.2deg)}100%{transform:translate(16px,130px) rotate(8deg);opacity:0}}
.mcta{display:none}
@media (max-width:767px){.mcta{display:flex}footer{padding-bottom:96px}}
.btn-dark:hover{background:#000000 !important}
@media (max-width:767px){
[style*="max-width: 1264px"]{padding-left:20px !important;padding-right:20px !important}
section[style*="padding: 120px 32px"]{padding-top:72px !important}
#faq{padding-bottom:72px !important}
[style*="padding: 112px 32px 120px"]{padding-top:72px !important;padding-bottom:80px !important}
[style*="padding: 104px 32px 152px"]{padding-top:40px !important;padding-bottom:112px !important;gap:40px !important}
header [style*="height: 72px"]{height:64px !important}
.stats{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.stats li{padding:18px 16px !important;flex-direction:column;align-items:flex-start !important;gap:10px !important}
.stats li > span:first-child{width:36px !important;height:36px !important;border-radius:10px !important}
.stats .big{font-size:26px !important}
.ticket-pad{padding-left:22px !important;padding-right:22px !important}
.mplay-off .l,.mplay-off .h,.mplay-off .g,.mplay-off .gl{animation:none !important}
.mplay-off .c1,.mplay-off .c2,.mplay-off .c3,.mplay-off .gd{animation:none !important;opacity:1}
}
@media (min-width:768px){.mmenu{display:none !important}}
section[id]{scroll-margin-top:80px}
.mcta{transition:transform .28s cubic-bezier(.22,1,.36,1)}
.mcta-off{transform:translateY(110%)}
.mlink{transition:background-color .15s}.mlink:hover{background:#F7F8FA}

/* --- Scrollbars --- */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background:rgba(21,26,35,.18);border-radius:999px;border:4px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:rgba(21,26,35,.36);border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:active{background:rgba(21,26,35,.5);border:3px solid transparent;background-clip:padding-box}
@supports (-moz-appearance:none){*{scrollbar-width:thin;scrollbar-color:rgba(21,26,35,.24) transparent}}
/* --- Liquid glass --- */
.lg-page{--gbg:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.58));--gbd:rgba(255,255,255,.78);--gsh:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 12px 32px -14px rgba(21,26,35,.20),0 2px 6px -2px rgba(21,26,35,.06);--gblur:blur(24px) saturate(180%);
background:radial-gradient(900px 620px at 0% 0%,#E2EBFF 0%,rgba(226,235,255,0) 62%),radial-gradient(900px 700px at 100% 40%,#ECF8D6 0%,rgba(236,248,214,0) 60%),radial-gradient(820px 620px at 15% 85%,#F1E8FF 0%,rgba(241,232,255,0) 60%),#F3F4F7 !important;background-attachment:fixed !important}
.lg-page [style*="background: #FFFFFF; border: 1px solid #DCE1E8"],.lg-page .card[style*="background: #FFFFFF"],.lg-page details[style*="background: #FFFFFF"]{background:var(--gbg) !important;border-color:var(--gbd) !important;box-shadow:var(--gsh) !important;-webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur)}
.lg-page [style*="border-radius: 24px"]{border-radius:30px !important}
.lg-page [style*="border-radius: 20px"]{border-radius:26px !important}
.lg-page .btn{border-radius:999px !important}
.lg-page .btn-accent{background:linear-gradient(180deg,#DCFF96 0%,#C5F66A 55%,#B2E852 100%) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(0,0,0,.06),0 12px 26px -12px rgba(105,155,20,.7) !important}
.lg-page .btn-dark{background:linear-gradient(180deg,#2C3849,#121A24) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 26px -12px rgba(0,0,0,.55) !important}
.lg-page .btn-line,.lg-page .btn-ghost-d{border-radius:999px !important}
.lg-page .fld{border-radius:16px !important;background:rgba(255,255,255,.72) !important;border-color:rgba(21,26,35,.10) !important}
.lg-page [role="tablist"]{background:rgba(118,118,128,.14) !important;border:none !important;border-radius:999px !important;padding:3px !important;box-shadow:none !important}
.lg-page [role="tablist"] button,.lg-page [role="group"] button{border-radius:999px !important}
.lg-page header{background:transparent !important;border-bottom:none !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;padding-top:12px}
.lg-page header > div[style]{max-width:1200px !important;border-radius:999px;background:var(--gbg);border:1px solid var(--gbd);box-shadow:var(--gsh);-webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur);padding:0 10px 0 22px !important}
.lg-page .c1,.lg-page .c2,.lg-page .c3{background:linear-gradient(180deg,rgba(44,56,74,.62),rgba(22,30,42,.50)) !important;border-color:rgba(255,255,255,.2) !important;-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-radius:999px !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 14px 30px -12px rgba(0,0,0,.55) !important}
.lg-page .c1 > span,.lg-page .c2 > span,.lg-page .c3 > span{border-radius:999px !important}
.lg-page .stats{background:transparent !important;border:none !important;box-shadow:none !important;overflow:visible !important;gap:12px !important}
.lg-page .stats li{background:var(--gbg) !important;border:1px solid var(--gbd);box-shadow:var(--gsh);border-radius:30px;-webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur)}
.lg-page .mcta{left:12px !important;right:12px !important;bottom:12px !important;border-radius:30px;border:1px solid var(--gbd) !important;background:var(--gbg) !important;box-shadow:var(--gsh)}
.lg-page .mmenu{top:84px !important;background:rgba(18,26,36,.18) !important}
.lg-page .mmenu nav{margin:0 12px;border-radius:30px;background:var(--gbg) !important;border:1px solid var(--gbd) !important;-webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur)}
.lg-page .pop{background:var(--gbg) !important;-webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur);border-color:var(--gbd) !important;border-radius:22px !important}
.lg-page .opt{border-radius:20px !important}
@media (max-width:767px){.lg-page header{padding-top:8px}.lg-page header > div[style]{margin:0 12px !important;padding:0 6px 0 14px !important}}
.lg-page header{margin-bottom:-84px}
.lg-page [style*="padding: 104px 32px 152px"]{padding-top:150px !important}
@media (max-width:767px){.lg-page [style*="padding: 104px 32px 152px"]{padding-top:104px !important}}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details .chev{transition:transform .22s cubic-bezier(.22,1,.36,1),background-color .2s}
details[open] .chev{transform:rotate(180deg);background:#C5F66A !important}
</style>

<style>.demo-badge{position:fixed;left:12px;bottom:12px;z-index:9999;font:600 12px Manrope,system-ui,sans-serif;background:#121A24;color:#C5F66A;padding:6px 10px;border-radius:999px;opacity:.85;pointer-events:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: #F7F8FA; overflow-x: clip">
<div class="lg-page {{motionCls}}" style="font-family: Manrope, system-ui, sans-serif; color: #151A23; background: #F7F8FA; min-height: 100vh; {{leaveStyle}}">
<a ref="{{setGo}}" href="upload.html" tabindex="-1" aria-hidden="true" style="display: none">Перейти к оформлению</a>

<header style="position: sticky; top: 0; z-index: 20; background: rgba(247,248,250,.88); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid #DCE1E8">
<div style="max-width: 1264px; margin: 0 auto; padding: 0 32px; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 18px; letter-spacing: -0.01em; color: #151A23">
<svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#121A24"></rect><path d="M10.5 7.5h7l5 5v11a1.5 1.5 0 0 1-1.5 1.5H10.5A1.5 1.5 0 0 1 9 23.5V9a1.5 1.5 0 0 1 1.5-1.5z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path><path d="M17.5 7.5v5h5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path><path d="M12.5 15.5h5.5M12.5 18.5h3.5" stroke="#8B97A8" stroke-width="1.6" stroke-linecap="round"></path><circle cx="22.5" cy="22.5" r="5.5" fill="#C5F66A" stroke="#121A24" stroke-width="1.5"></circle><path d="M20.2 22.6l1.6 1.6 3-3.2" fill="none" stroke="#121A24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>Оформление</span>
</a>
<nav class="nav" aria-label="Основное меню" style="display: flex; gap: 32px; font-size: 15px; font-weight: 600">
<a href="#how" style="text-decoration: none; color: #596273">Как работает</a>
<a href="#fix" style="text-decoration: none; color: #596273">Что исправляем</a>
<a href="#price" style="text-decoration: none; color: #596273">Стоимость</a>
<a href="#faq" style="text-decoration: none; color: #596273">Вопросы</a>
</nav>
<div style="display: flex; gap: 8px; align-items: center">
<a href="upload.html" onClick="{{go}}" class="btn btn-accent" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; background: #C5F66A; color: #121A24; font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap"><span>Оформить<span class="hide-m"> работу</span></span><svg class="arr hide-m" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
<button type="button" class="menu-btn" aria-label="{{menuLabel}}" aria-expanded="{{menuStr}}" aria-controls="mmenu" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DCE1E8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#151A23" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg></button>
</div>
</div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div id="mmenu" class="mmenu" onKeyDown="{{menuKey}}" style="position: fixed; top: 64px; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(18,26,36,.45)">
<nav aria-label="Мобильное меню" style="background: #FFFFFF; border-bottom: 1px solid #DCE1E8; padding: 4px 20px 20px; display: flex; flex-direction: column; box-shadow: 0 20px 40px -20px rgba(21,26,35,.4)">
<a href="#how" class="mlink" onClick="{{closeMenu}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 4px; border-bottom: 1px solid #EEF0F3; font-size: 18px; font-weight: 700; text-decoration: none; color: #151A23">Как работает<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#596273" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a><a href="#fix" class="mlink" onClick="{{closeMenu}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 4px; border-bottom: 1px solid #EEF0F3; font-size: 18px; font-weight: 700; text-decoration: none; color: #151A23">Что исправляем<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#596273" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a><a href="#price" class="mlink" onClick="{{closeMenu}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 4px; border-bottom: 1px solid #EEF0F3; font-size: 18px; font-weight: 700; text-decoration: none; color: #151A23">Стоимость<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#596273" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a><a href="#faq" class="mlink" onClick="{{closeMenu}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 4px; border-bottom: 1px solid #EEF0F3; font-size: 18px; font-weight: 700; text-decoration: none; color: #151A23">Вопросы<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#596273" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="upload.html" onClick="{{goMenu}}" class="btn btn-accent" style="margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; background: #C5F66A; color: #121A24; font-weight: 700; font-size: 16px; text-decoration: none">Оформить работу</a>
</nav>
</div>
</sc-if>

<section id="top" style="position: relative; overflow: hidden; background: radial-gradient(110% 85% at 88% 0%, rgba(74,123,208,.30) 0%, rgba(74,123,208,0) 55%), radial-gradient(80% 70% at 0% 100%, rgba(197,246,106,.10) 0%, rgba(197,246,106,0) 60%), linear-gradient(165deg, #131C27 0%, #0F161F 100%); color: #FFFFFF">

<div style="position: relative; max-width: 1264px; margin: 0 auto; padding: 104px 32px 152px; display: flex; flex-wrap: wrap; align-items: center; gap: 72px">
<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 26px">
<p class="fadeup" style="margin: 0; display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); border-radius: 999px; font-size: 14px; color: #C9D1DC">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #C5F66A; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#121A24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>
По шаблону кафедры или вашим настройкам</p>
<h1 class="fadeup" style="margin: 0; font-size: clamp(40px, 5.2vw, 70px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; animation-delay: .07s">Оформите работу по требованиям <span style="color: #C5F66A">вашей кафедры</span></h1>
<p class="fadeup" style="margin: 0; font-size: 19px; line-height: 1.55; color: #C9D1DC; max-width: 540px; animation-delay: .14s">Загрузите DOCX, выберите шаблон или задайте параметры. Посмотрите изменения и скачайте исправленный документ.</p>
<div class="fadeup" style="display: flex; flex-wrap: wrap; gap: 12px; animation-delay: .21s">
<a href="upload.html" onClick="{{go}}" class="btn btn-accent full-m" style="display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 14px; background: #C5F66A; color: #121A24; font-weight: 700; font-size: 17px; text-decoration: none; box-shadow: 0 10px 30px -10px rgba(197,246,106,.55)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"></path><path d="M7.5 8.5L12 4l4.5 4.5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
Загрузить работу</a>
<a href="#compare" class="btn btn-ghost-d full-m" style="display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 22px; border-radius: 14px; border: 1px solid rgba(255,255,255,.22); color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="1.5"></rect><rect x="13" y="4" width="8" height="16" rx="1.5"></rect><path d="M5.5 8h3M5.5 11h3M15.5 8h3M15.5 11h3"></path></svg>
Посмотреть пример</a>
</div>
<div class="fadeup" style="display: flex; gap: 14px; align-items: center; align-self: flex-start; max-width: 520px; padding: 12px 18px 12px 12px; border-radius: 18px; background: rgba(197,246,106,.07); border: 1px solid rgba(197,246,106,.28); animation-delay: .25s">
<span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #C5F66A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121A24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span>

<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false, reduced: false, tab: 'before', leaving: false, tearing: false, mplay: false, menuOpen: false, scrolled: false };
    this.goEl = null;
  }
  componentDidMount() {
    this.onScroll = () => {
      const v = (window.scrollY || 0) > 520;
      if (v !== this.state.scrolled) this.setState({ scrolled: v });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    clearTimeout(this.goT0);
    clearTimeout(this.goT1);
    clearTimeout(this.goT2);
  }
  leave(e, tear) {
    const sysReduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.state.reduced || sysReduce || !this.goEl || this.state.leaving || this.state.tearing) return;
    e.preventDefault();
    const fadeAt = tear ? 560 : 0;
    if (tear) this.setState({ tearing: true });
    this.goT0 = setTimeout(() => this.setState({ leaving: true }), fadeAt);
    this.goT1 = setTimeout(() => { if (this.goEl) this.goEl.click(); }, fadeAt + 300);
    this.goT2 = setTimeout(() => this.setState({ leaving: false, tearing: false }), fadeAt + 900);
  }
  renderVals() {
    const s = this.state;
    const isM = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
    const stopped = isM ? !s.mplay : s.paused;
    const flip = {
      setGo: (el) => { this.goEl = el; },
      leaveStyle: s.leaving ? 'opacity: 0; transition: opacity .28s ease' : '',
      tearCls: s.tearing ? 'tear' : '',
      stubStyle: s.tearing ? 'transform: translateY(-3px)' : '',
      go: (e) => this.leave(e, false),
      goTear: (e) => this.leave(e, true)
    };
    const on = 'background: #FFFFFF; color: #151A23; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04)';
    const off = 'background: transparent; color: #596273';
    return {
      ...flip,
      paused: stopped,
      playing: !stopped,
      pausedStr: stopped ? 'true' : 'false',
      pauseLabel: isM ? (s.mplay ? 'Пауза' : 'Запустить демо') : (s.paused ? 'Продолжить' : 'Пауза'),
      togglePause: () => (isM ? this.setState({ mplay: !s.mplay }) : this.setState({ paused: !s.paused })),
      mctaCls: s.scrolled && !s.menuOpen ? '' : 'mcta-off',
      mctaHidden: s.scrolled && !s.menuOpen ? 'false' : 'true',
      menuOpen: s.menuOpen,
      menuStr: s.menuOpen ? 'true' : 'false',
      menuLabel: s.menuOpen ? 'Закрыть меню' : 'Открыть меню',
      menuIcon: s.menuOpen ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h10',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      menuKey: (e) => { if (e.key === 'Escape') this.setState({ menuOpen: false }); },
      goMenu: (e) => { this.setState({ menuOpen: false }); this.leave(e, false); },
      reducedStr: s.reduced ? 'true' : 'false',
      toggleReduce: () => this.setState({ reduced: !s.reduced }),
      switchTrack: s.reduced ? 'background: #C5F66A' : 'background: #3A4554',
      switchKnob: s.reduced ? 'transform: translateX(18px)' : 'transform: none',
      motionCls: (s.paused ? 'paused ' : '') + (s.mplay ? '' : 'mplay-off ') + (s.reduced ? 'reduced' : ''),
      showBefore: () => this.setState({ tab: 'before' }),
      showAfter: () => this.setState({ tab: 'after' }),
      tabBeforeSel: s.tab === 'before' ? 'true' : 'false',
      tabAfterSel: s.tab === 'after' ? 'true' : 'false',
      tabBeforeStyle: s.tab === 'before' ? on : off,
      tabAfterStyle: s.tab === 'after' ? on : off,
      beforeCls: s.tab === 'after' ? 'hide-m' : '',
      afterCls: s.tab === 'before' ? 'hide-m' : ''
    };
  }
}

window.dcMount(Component, document.getElementById('tpl'), document.getElementById('app'));
</script>
